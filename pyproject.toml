[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-collab"
version = "0.1.0"
license = {text = "MIT"}
description = "Authenticated file-based messaging for interactive coding-agent sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.17,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agent-collab = "agent_collab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
